<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kiran Classes</title>
<link rel="icon" href="logo.png"><link rel="apple-touch-icon" href="logo.png"><meta name="theme-color" content="#1D4ED8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F7F9;--ink:#1B1E28;--mute:#6B7280;--line:#E8EAF0;--blue:#1D4ED8;--navy:#0A1F5C;--tint:#EEF2FF;--soft:#F1F4FB;--orange:#EA6A12;--red:#E11D48;--green:#15803D}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.4}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input{font:inherit;color:inherit}
.screen{display:none;min-height:100%}.screen.on{display:block}.hide{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* login */
#login.on{display:flex;flex-direction:column;height:100%;padding:calc(36px + env(safe-area-inset-top)) 24px 0}
#login .blob{display:flex;justify-content:center;margin-bottom:34px}
#login h1{font-size:30px;line-height:1.25;font-weight:800;margin-bottom:26px}
#login h1 i{display:inline-block;vertical-align:middle;margin-left:8px;background:#DBE6FF;border:2px solid var(--ink);border-radius:99px;padding:5px 12px;font-style:normal;font-size:10px;letter-spacing:3px;color:var(--blue)}
.fld{display:block;width:100%;padding:18px 18px;border:2px solid #D7DCEA;border-radius:16px;background:#fff;outline:0;font-size:16px}
.fld:focus{border-color:var(--blue)}
.otps{display:flex;gap:10px;justify-content:space-between}.otps input{width:100%;min-width:0;height:62px;text-align:center;font-size:24px;font-weight:700;border:2px solid #D7DCEA;border-radius:14px;background:#fff;outline:0}
.otps input:focus{border-color:var(--blue)}
#login .sub{color:var(--mute);margin:-14px 0 22px}#login .sub b{color:var(--blue);font-weight:600}
.cont{margin-top:auto;margin-bottom:18px;width:100%;padding:18px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:16px}
.cont:disabled{background:#9AA0AC}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
.safe{margin:0 -24px;padding:14px 24px;background:#EEF2FD;color:#374151;font-size:14px;display:flex;gap:10px;align-items:center}
.terms{margin:0 -24px;padding:14px 24px calc(14px + env(safe-area-inset-bottom));font-size:14px;color:#374151}.terms b{color:var(--blue);font-weight:600}
.lnk{color:var(--blue);font-weight:600;text-decoration:underline;margin-top:18px;text-align:left}
/* shell */
#app.on{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;background:#fff;box-shadow:0 1px 8px rgba(20,30,60,.06);z-index:2}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;flex:none}
.pillsel{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:#fff;box-shadow:0 2px 12px rgba(20,30,60,.12);font-weight:700;max-width:60%}
.pillsel .em{width:26px;height:26px;border-radius:50%;background:#DBE6FF;display:grid;place-items:center;color:var(--blue)}
.pillsel span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pillsel .i{color:var(--blue);width:18px}
.spc{flex:1}
.cpill{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);font-weight:700;font-size:14px;background:#fff}
.cpill .i{color:var(--blue);width:18px;height:18px}
.search{flex:1;display:flex;align-items:center;gap:10px;padding:11px 14px;border:1.5px solid #C9CFDC;border-radius:10px;background:#fff;color:var(--mute)}
.search input{border:0;outline:0;flex:1;min-width:0;background:none}
main{flex:1;overflow:auto;padding:0 0 24px}
.pad{padding:0 16px}
h2.hd{font-size:26px;font-weight:800;margin:26px 16px 2px}
.sb{color:var(--mute);margin:0 16px}
.xc{display:flex;align-items:center;gap:16px;background:#fff;border-radius:18px;padding:16px;margin:0 16px 14px;box-shadow:0 2px 14px rgba(20,30,60,.08);border:1px solid #F0F1F5;text-align:left;width:calc(100% - 32px)}
.xc .ic{width:56px;height:56px;border-radius:50%;background:var(--tint);display:grid;place-items:center;color:var(--blue);flex:none}
.xc .ic .i{width:26px;height:26px}
.xc b{display:block;font-size:17px}.xc small{color:var(--mute);font-size:14px}.xc .go{margin-left:auto;color:var(--ink)}
.more{display:flex;justify-content:center;gap:8px;font-weight:700;padding:14px;border-top:1px solid var(--line);margin:8px 16px 0}
.band{margin:16px 0 0;background:linear-gradient(120deg,#DCE8FF,#EAF1FF);padding:22px 16px}
.band .box{background:linear-gradient(120deg,var(--navy),#1D4ED8);color:#fff;border-radius:20px;padding:22px}
.band .box b{font-size:22px;display:block;line-height:1.2}.band .box small{opacity:.85}
.tag{font-size:30px;line-height:1.35;font-weight:800;color:#B6BAC6;padding:34px 16px 6px}
.tag2{padding:0 16px 20px;color:#9AA0AC;font-weight:600;font-size:18px}
.strip{background:var(--tint);padding:12px 16px;display:flex;align-items:center;font-weight:700}
.strip a{margin-left:auto;color:var(--blue);font-weight:700}
.chips{display:flex;gap:10px;overflow:auto;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff;align-items:center}
.chips small{font-weight:700;font-size:12px;color:var(--mute);flex:none;line-height:1.1;max-width:70px}
.chip{flex:none;padding:10px 16px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;background:#fff}
.chip.on{border-color:var(--blue);color:var(--blue);background:var(--tint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;padding:0 16px}
.bc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.th{aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#E6EDFF,#CFDDFF);background-size:cover;background-position:center;display:grid;place-items:center;color:var(--blue);font-weight:800;font-size:22px;overflow:hidden}
.bc .r{display:flex;justify-content:space-between;align-items:center}.bc .cl{color:var(--orange);font-weight:700;font-size:14px}
.lang{font-size:11px;font-weight:700;border:1px solid #9CA3AF;border-radius:5px;padding:1px 7px;color:#4B5563}
.bc h4{font-size:17px;font-weight:800;line-height:1.2;text-transform:uppercase}.bc p{color:#4B5563;font-size:13px}
.bc .pr{display:flex;align-items:center;gap:8px;margin-top:auto}
.pr b{color:var(--green);font-size:18px}
.dk{background:var(--ink);color:#fff;border-radius:10px;padding:11px 14px;font-weight:700;flex:1}
.ar{border:1.5px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.sec{font-size:22px;font-weight:800;padding:22px 16px 4px}
.hs{display:flex;gap:12px;overflow:auto;padding:10px 16px 6px}
.sc{flex:none;width:150px;height:170px;background:#fff;border-radius:14px;box-shadow:0 3px 12px rgba(20,30,60,.12);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 8px 12px;font-weight:600}
.sc .ic{width:54px;height:54px;border-radius:50%;background:#E6F4FA;display:grid;place-items:center;color:#2A8BC7}
.row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;align-items:center;gap:12px;margin:0 16px 12px}
.row .th{width:112px;flex:none;font-size:16px}.row .t{flex:1;min-width:0;font-weight:700}
.btn{padding:10px 16px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:14px}
.btn.g{background:#fff;color:var(--blue);border:1.5px solid var(--line)}.btn.r{background:var(--red)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--tint);color:var(--blue)}
.pill.live{background:#FFE4EA;color:var(--red)}.pill.end{background:#EEF1F6;color:var(--mute)}
.empty{text-align:center;padding:50px 24px;color:var(--mute)}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 16px 0}
.card h4{font-size:17px;font-weight:800;margin-bottom:10px}
.inp{display:block;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;outline:0;background:#fff}
.inp:focus{border-color:var(--blue)}
.pick{display:flex;align-items:center;gap:12px;margin-bottom:10px}.pick .th{width:120px;font-size:12px;color:var(--mute)}
details{border-top:1px solid var(--line);padding:12px 0}summary{font-weight:700;cursor:pointer;display:flex;gap:10px;align-items:center}
details .row{margin:10px 0 0}
.me{display:flex;align-items:center;gap:14px}.av{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#7FB0FF,#1D4ED8);color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px;flex:none}
.hl{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);color:var(--blue);font-weight:700;text-decoration:none}
.tabs{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:12px 0 8px;font-size:12px;font-weight:600;color:#8B92A1;display:flex;flex-direction:column;align-items:center;gap:4px;border-top:3px solid transparent;margin-top:-1px}
.tabs button.on{color:var(--ink);font-weight:800;border-top-color:var(--ink)}
#veil{position:fixed;inset:0;background:rgba(10,15,30,.55);opacity:0;pointer-events:none;transition:.2s;z-index:30}#veil.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(330px,86%);background:#fff;z-index:31;transform:translateX(-100%);transition:transform .25s;padding:calc(30px + env(safe-area-inset-top)) 16px 20px;overflow:auto}
#drawer.on{transform:none}
.dr{display:flex;align-items:center;gap:16px;width:100%;padding:16px 8px;font-size:16px;font-weight:500;text-align:left;color:var(--ink);text-decoration:none}
.dr .i{width:26px;height:26px}
.dbox{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:14px;padding:16px;font-weight:600;width:100%;margin:18px 0 8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:120;max-width:90%}#toast.show{opacity:1;transform:translate(-50%,0)}
/* room */
#room.on{display:flex;flex-direction:column;height:100%;background:#0A1226;color:#fff}
.rtop{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.rtop .nm{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtop .ib{background:rgba(255,255,255,.1);position:relative}.rtop .ib svg{stroke:#fff}
.dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#F43F5E}
.wrap{flex:1;display:grid;grid-template-columns:1fr;min-height:0;position:relative}
.main{display:flex;flex-direction:column;min-width:0;overflow:auto}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.stage .vid{position:absolute;inset:0}
.stage .vid>div{background:#000!important}
.stage .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#9FB3E8;padding:16px;font-weight:600}
.stage .badge{position:absolute;top:10px;left:10px;background:var(--red);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;z-index:2}
.ctl{display:flex;justify-content:center;gap:14px;padding:16px;flex-wrap:wrap}
.cb{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.cb svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cb.off{background:#fff}.cb.off svg{stroke:var(--red)}
.cb.on2{background:var(--blue)}.cb.end{background:var(--red)}
.hint{text-align:center;color:#9FB3E8;font-size:13px;padding:0 20px 14px}
#chat{position:fixed;top:0;bottom:0;right:0;width:min(370px,100%);background:#fff;color:var(--ink);transform:translateX(100%);transition:transform .25s;z-index:40;display:flex;flex-direction:column}
#chat.open{transform:none}
#chat .ch{display:flex;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;border-bottom:1px solid var(--line);font-weight:800;color:var(--navy)}
#chat .ch span{flex:1}
#chatList{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{background:var(--soft);border-radius:14px;padding:9px 12px;max-width:92%}.m b{display:block;font-size:12px;color:var(--mute)}
.m.t{background:#E3ECFF}.m.t b{color:var(--blue)}
#chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);padding-bottom:calc(12px + env(safe-area-inset-bottom))}
#chat form .field{margin:0;padding:12px}
.fsb{position:absolute;right:10px;bottom:10px;z-index:3;width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.55);display:grid;place-items:center}
.fsb svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#room.fs{position:fixed;inset:0;z-index:70;height:100dvh;width:100%}
#room.fs .rtop,#room.fs .hint,#room.fs #chatBtn{display:none}
#room.fs.nc .wrap{grid-template-columns:1fr}#room.fs.nc #chat{display:none}
#chatFab{display:none;right:56px}#room.fs.nc #chatFab{display:grid}
#chat .ch .ib{background:var(--soft);border-radius:50%;color:var(--navy)}#chat .ch .ib svg{stroke:var(--navy)}
#room.fs .wrap{grid-template-columns:1fr 340px}
#room.fs .main{justify-content:center;background:#000;overflow:hidden}
#room.fs .stage{width:min(100%,calc((100dvh - 70px)*16/9));margin:0 auto;flex:none}
#room.fs .ctl{padding:8px;gap:10px;flex:none}
#room.fs .cb{width:44px;height:44px}
#room.fs #chat{position:static;transform:none;display:flex;width:auto;height:100dvh}
#room.fs #chat .ch{padding-top:12px}
@media(orientation:portrait){#room.fs .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}#room.fs.nc .wrap{grid-template-rows:1fr}#room.fs .main{overflow:auto}#room.fs .stage{width:100%}#room.fs #chat{height:auto;min-height:0}}
@media(min-width:900px){
 .wrap.co{grid-template-columns:1fr 370px}
 #chat{position:static;transform:none;display:none;width:auto}
 .wrap.co #chat{display:flex}
}
.rtop .ib{background:rgba(255,255,255,.1);position:relative;color:#fff}.dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#F43F5E}
.cb svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cb.off svg{stroke:var(--red)}
.ch .ib{color:var(--navy)}
#chat .btn{border-radius:12px}
.fld.s{padding:12px}.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;background:#fff}.opt.on{border-color:var(--blue);background:var(--tint)}.opt.ok{border-color:var(--green);background:#E8F7EE}.opt.bad{border-color:var(--red);background:#FFE9EE}select.inp{appearance:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== premium layer ===== */
:root{--g1:linear-gradient(135deg,#8B5CF6,#4F46E5);--g2:linear-gradient(135deg,#2563EB,#06B6D4);--g3:linear-gradient(135deg,#F59E0B,#EF4444);--wa:linear-gradient(135deg,#128C3E,#25D366)}
body{background:linear-gradient(180deg,#EEF1FC 0,#F6F7F9 280px) fixed}
.top{background:rgba(255,255,255,.94);backdrop-filter:blur(10px)}
.lg{display:inline-grid;place-items:center;flex:none;border-radius:28%;background:linear-gradient(135deg,#1D4ED8,#0A1F5C);color:#fff;font-weight:800;overflow:hidden}
.lg img{width:100%;height:100%;object-fit:cover;display:block}
.pillsel .em{background:none;width:30px;height:30px;overflow:visible}
.hero{margin:14px 16px 0;border-radius:26px;padding:18px;color:#fff;background:linear-gradient(135deg,#0A1F5C 0,#1D4ED8 58%,#7C5CF6);display:flex;gap:16px;align-items:center;position:relative;overflow:hidden;box-shadow:0 14px 32px rgba(29,78,216,.3)}
.hero:before{content:"";position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero:after{content:"";position:absolute;left:40%;bottom:-60px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .tp{width:96px;height:118px;border-radius:22px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;overflow:hidden;flex:none;z-index:1}
.hero .tp img{width:100%;height:100%;object-fit:cover}
.hero>div:last-child{z-index:1}.hero small{opacity:.85;font-weight:600}.hero b{display:block;font-size:23px;line-height:1.2;margin:2px 0 8px}.hero .q{font-size:13px;opacity:.92;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 16px 0}
.stats div{background:#fff;border-radius:18px;padding:13px 8px;text-align:center;box-shadow:0 6px 18px rgba(20,30,60,.07);border:1px solid #EEF0F6}
.stats b{display:block;font-size:21px;font-weight:800;background:var(--g2);-webkit-background-clip:text;background-clip:text;color:transparent}.stats small{color:var(--mute);font-weight:600;font-size:12px}
.xc{border-radius:22px;box-shadow:0 10px 26px rgba(30,41,90,.1);transition:transform .15s}.xc:active{transform:scale(.98)}
.xc .ic{width:60px;height:60px;border-radius:19px;color:#fff;box-shadow:0 8px 18px rgba(79,70,229,.28)}.xc .ic .i{stroke:#fff;width:28px;height:28px}
.xc .ic.k1{background:var(--g1)}.xc .ic.k2{background:var(--g2)}.xc .ic.k3{background:var(--g3)}
.wa{display:flex;align-items:center;gap:14px;margin:0 16px 14px;padding:16px;border-radius:22px;background:var(--wa);color:#fff;text-decoration:none;box-shadow:0 10px 24px rgba(18,140,62,.3)}
.wa .wi{width:52px;height:52px;border-radius:17px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}.wa .i{stroke:#fff}
.wa b{display:block;font-size:17px}.wa small{opacity:.92}.wa .go{margin-left:auto}
.bc{border-radius:22px;box-shadow:0 10px 24px rgba(30,41,90,.09)}
.dk{background:linear-gradient(135deg,#111827,#1F2A5C)}
.btn{background:linear-gradient(135deg,#2563EB,#4F46E5);box-shadow:0 5px 12px rgba(37,99,235,.22)}.btn.g{background:#fff;box-shadow:none}.btn.r{background:var(--red);box-shadow:none}
.cont{background:linear-gradient(135deg,#2563EB,#4F46E5);box-shadow:0 8px 20px rgba(37,99,235,.3)}
.row,.card{box-shadow:0 4px 16px rgba(20,30,60,.05)}
.band .box{display:flex;gap:14px;align-items:center;box-shadow:0 12px 28px rgba(10,31,92,.3)}
.tabs button.on{color:var(--blue);border-top-color:var(--blue)}.tabs button.on .i{stroke:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
.tile{position:relative;border-radius:22px;padding:16px 14px;color:#fff;text-align:left;min-height:116px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;box-shadow:0 12px 24px rgba(30,41,90,.18)}
.tile:before{content:"";position:absolute;right:-20px;top:-20px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.18)}
.tile b{font-size:19px;font-weight:800;line-height:1.2}.tile small{opacity:.92;font-weight:600;margin-top:2px}
.tile.c0{background:linear-gradient(135deg,#6366F1,#4338CA)}.tile.c1{background:linear-gradient(135deg,#0EA5E9,#2563EB)}.tile.c2{background:linear-gradient(135deg,#F59E0B,#EA580C)}.tile.c3{background:linear-gradient(135deg,#10B981,#047857)}.tile.c4{background:linear-gradient(135deg,#EC4899,#BE185D)}.tile.c5{background:linear-gradient(135deg,#8B5CF6,#6D28D9)}

 for(let i=0;i<n;i++){const b=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f.slice(i*SZ,(i+1)*SZ))});await api('/chapters/'+ch.id+'/pdf?i='+i+'&n='+n,'POST',{data:b});toast('Uploading '+Math.round(100*(i+1)/n)+'%')}}

function videoEl(u){const w=el('div');w.style.cssText='position:relative;width:100%;aspect-ratio:16/9;background:#000';let m,src='';
 if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|live\/|shorts\/))([\w-]{11})/))src='https://www.youtube.com/embed/'+m[1]+'?rel=0';
 else if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))src='https://drive.google.com/file/d/'+m[1]+'/preview';
 if(src){const f=document.createElement('iframe');f.src=src;f.allow='autoplay; fullscreen; picture-in-picture';f.allowFullscreen=true;f.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0';w.append(f);return w}
 if(/\.(mp4|webm|m3u8)(\?|$)/i.test(u)){const x=document.createElement('video');x.src=u;x.controls=true;x.playsInline=true;x.style.cssText='width:100%;height:100%';w.append(x);return w}
 return null}

  const m=el('div','');m.id='recmsg';m.textContent='Recording load ho rahi hai...';
  const src='/api/rec/play?class_id='+k.id+'&t='+encodeURIComponent(tok);
  let ok=false;x.onloadedmetadata=()=>{ok=true;m.style.display='none'};x.onplaying=()=>{ok=true;m.style.display='none'};
  x.onerror=()=>{const e=x.error,c=e?e.code:0;m.className='err';m.style.display='block';m.textContent='Video nahi chal paya'+(c?' (code '+c+')':'')+'. Neeche "Download" dabao aur file phone ke player mein kholo. Agar baar baar aaye toh teacher ko batao.'};
  setTimeout(()=>{if(!ok&&!x.error){m.textContent='Video load hone mein der lag rahi hai... Agar na chale toh neeche "Download" dabao.'}},12000);
  x.src=src;v.append(x,m);

  const dl=el('a','btn g','Download');dl.href=src+'&dl=1';dl.setAttribute('download',(k.title||'class')+'.mp4');dl.style.cssText='flex:1;text-align:center;text-decoration:none';
  const o=el('a','btn g','Open in new tab');o.href=src;o.target='_blank';o.rel='noopener';o.style.cssText='flex:1;text-align:center;text-decoration:none';row.append(dl,o);v.append(row);return}

const escH=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function mdIn(s){s=escH(s);const cd=[];s=s.replace(/`([^`]+)`/g,(m,c)=>{cd.push(c);return '\u0000'+(cd.length-1)+'\u0000'});
 s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,!?:;]|$)/g,'$1<i>$2</i>').replace(/~~([^~]+)~~/g,'<s>$1</s>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+cd[i]+'</code>')}
function md(src){const L=String(src).replace(/\r/g,'').split('\n'),UL=/^\s*([-*\u2022])\s+/,OL=/^\s*\d+[.)]\s+/,TB=/^\s*\|.*\|\s*$/;let o='',i=0;
 while(i<L.length){const l=L[i];let m;
  if(/^```/.test(l)){const c=[];i++;while(i<L.length&&!/^```/.test(L[i])){c.push(L[i]);i++}i++;o+='<pre><code>'+escH(c.join('\n'))+'</code></pre>';continue}
  if(/^\s*$/.test(l)){i++;continue}
  if((m=l.match(/^(#{1,4})\s+(.*)$/))){const n=Math.min(5,m[1].length+1);o+='<h'+n+'>'+mdIn(m[2])+'</h'+n+'>';i++;continue}
  if(/^\s*([-*_])\1{2,}\s*$/.test(l)){o+='<hr>';i++;continue}
  if(/^>\s?/.test(l)){const q=[];while(i<L.length&&/^>\s?/.test(L[i])){q.push(L[i].replace(/^>\s?/,''));i++}o+='<blockquote>'+mdIn(q.join(' '))+'</blockquote>';continue}
  if(TB.test(l)&&i+1<L.length&&/^\s*\|?\s*:?-{2,}/.test(L[i+1])){const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim()),hd=cells(l),rows=[];i+=2;while(i<L.length&&TB.test(L[i])){rows.push(cells(L[i]));i++}
   o+='<div class="tw"><table><thead><tr>'+hd.map(x=>'<th>'+mdIn(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+mdIn(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}
  if(UL.test(l)||OL.test(l)){const ord=OL.test(l),re=ord?OL:UL,st=ord?parseInt(l.match(/^\s*(\d+)/)[1],10):1,it=[];while(i<L.length&&re.test(L[i])){it.push(L[i].replace(re,''));i++}
   o+=(ord?'<ol'+(st>1?' start="'+st+'"':'')+'>':'<ul>')+it.map(t=>'<li>'+mdIn(t)+'</li>').join('')+(ord?'</ol>':'</ul>');continue}
  const p=[];while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(```|#{1,4}\s|>\s?)/.test(L[i])&&!UL.test(L[i])&&!OL.test(L[i])&&!TB.test(L[i])){p.push(L[i]);i++}
  if(!p.length){p.push(L[i]);i++}o+='<p>'+p.map(mdIn).join('<br>')+'</p>'}
 return o}
